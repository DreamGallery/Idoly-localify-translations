name: Verified localization releases
on:
  schedule:
    - cron: '0 15 * * *' # Asia/Shanghai 23:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: Prepare and validate assets without publishing
        type: boolean
        default: true
      no_translate:
        description: Disable model calls (new incomplete content blocks publication)
        type: boolean
        default: false
      api_base:
        description: Optional API base URL (empty uses repository variable)
        type: string
        default: ''
      model:
        description: Optional model name (empty uses repository variable)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: idoly-localization-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (vars.RELEASE_ENABLED == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run == true))
    permissions:
      contents: write
    runs-on: [self-hosted, Linux, X64]
    environment: localization-release
    timeout-minutes: 180
    env:
      IDOLY_RUNNER_CONFIG: ${{ vars.IDOLY_RUNNER_CONFIG }}
    steps:
      - name: Check runner configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IDOLY_RUNNER_CONFIG" && test -f "$IDOLY_RUNNER_CONFIG"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path(os.environ['IDOLY_RUNNER_CONFIG']).read_text())
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              if config.get('bin_dir'):
                  output.write(str(Path(config['bin_dir'])) + '\n')
              if config.get('java_home'):
                  output.write(str(Path(config['java_home']) / 'bin') + '\n')
          PY
      # Code comes only from trusted private repositories; optionally pin a commit. Public Issues,
      # PR heads, artifact scripts and CSV fields are never executed on this runner.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          path: translations-data
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DreamGallery/Idoly-localify
          ref: ${{ vars.IDOLY_SOURCE_REF || 'main' }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: Idoly-localify
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DreamGallery/HoshimiToolkit
          ref: ${{ vars.TOOLKIT_REF || 'main' }}
          ssh-key: ${{ secrets.TOOLKIT_DEPLOY_KEY }}
          path: HoshimiToolkit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DreamGallery/Hoshimi_Teleprompter
          ref: ${{ vars.TRANSLATOR_REF || 'main' }}
          ssh-key: ${{ secrets.TRANSLATOR_DEPLOY_KEY }}
          path: Hoshimi_Teleprompter
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DreamGallery/Hoshimi-Adv
          path: Hoshimi-Adv
          persist-credentials: false
      - name: Fetch changes, validate collaboration and publish complete assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ inputs.api_base || vars.OPENAI_API_BASE }}
          OPENAI_MODEL: ${{ inputs.model || vars.OPENAI_MODEL }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          NO_TRANSLATE: ${{ inputs.no_translate || false }}
        run: |
          set -euo pipefail
          flags=()
          [[ "$DRY_RUN" == true ]] && flags+=(--dry-run)
          [[ "$NO_TRANSLATE" == true ]] && flags+=(--no-translate)
          python3 Idoly-localify/tools/release_translations.py --config "$IDOLY_RUNNER_CONFIG" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-dir "$GITHUB_WORKSPACE/translations-data" \
            --project "$GITHUB_WORKSPACE/Idoly-localify" \
            --adv-dir "$GITHUB_WORKSPACE/Hoshimi-Adv" \
            --toolkit-dir "$GITHUB_WORKSPACE/HoshimiToolkit" \
            --translator-dir "$GITHUB_WORKSPACE/Hoshimi_Teleprompter" \
            "${flags[@]}"
