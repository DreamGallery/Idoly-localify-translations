name: Verified localization releases
run-name: ${{ inputs.schedule_key && format('Scheduled localization release {0}', inputs.schedule_key) || 'Verified localization releases' }}
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Prepare and validate assets without publishing
        type: boolean
        default: true
      no_translate:
        description: Disable model calls (new incomplete content blocks publication)
        type: boolean
        default: false
      schedule_key:
        description: 外部定时触发标识（手动运行留空）
        type: string
        required: false
      text_releases_to_keep:
        description: 保留的文本版本数（留空用仓库设置，默认 3；0 关闭清理）
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: idoly-localization-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (vars.RELEASE_ENABLED == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run == true))
    permissions:
      contents: write
    runs-on: [self-hosted, Linux, X64]
    environment: localization-release
    timeout-minutes: 180
    env:
      IDOLY_RUNNER_CONFIG: ${{ vars.IDOLY_RUNNER_CONFIG }}
    steps:
      - name: Check runner configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IDOLY_RUNNER_CONFIG" && test -f "$IDOLY_RUNNER_CONFIG"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path(os.environ['IDOLY_RUNNER_CONFIG']).read_text())
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              if config.get('bin_dir'):
                  output.write(str(Path(config['bin_dir'])) + '\n')
              if config.get('java_home'):
                  output.write(str(Path(config['java_home']) / 'bin') + '\n')
          PY
      # Code comes only from trusted repositories; optionally pin a commit. Public Issues,
      # PR heads, artifact scripts and CSV fields are never executed on this runner.
      - uses: actions/checkout@v4
        with:
          path: translations-data
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: DreamGallery/Idoly-localify
          ref: ${{ vars.IDOLY_SOURCE_REF || 'main' }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: Idoly-localify
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: DreamGallery/HoshimiToolkit
          ref: ${{ vars.TOOLKIT_REF || 'main' }}
          ssh-key: ${{ secrets.TOOLKIT_DEPLOY_KEY }}
          path: HoshimiToolkit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: DreamGallery/Hoshimi_Teleprompter
          ref: ${{ vars.TRANSLATOR_REF || 'main' }}
          ssh-key: ${{ secrets.TRANSLATOR_DEPLOY_KEY }}
          path: Hoshimi_Teleprompter
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: DreamGallery/Hoshimi-Adv
          path: Hoshimi-Adv
          persist-credentials: false
      - name: Check translation data files
        run: python3 translations-data/scripts/check_release_data.py translations-data
      - name: Fetch changes, validate collaboration and publish complete assets
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          NO_TRANSLATE: ${{ inputs.no_translate || false }}
        run: |
          set -euo pipefail
          flags=()
          [[ "$DRY_RUN" == true ]] && flags+=(--dry-run)
          [[ "$NO_TRANSLATE" == true ]] && flags+=(--no-translate)
          python3 Idoly-localify/tools/release_translations.py --config "$IDOLY_RUNNER_CONFIG" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-dir "$GITHUB_WORKSPACE/translations-data" \
            --project "$GITHUB_WORKSPACE/Idoly-localify" \
            --adv-dir "$GITHUB_WORKSPACE/Hoshimi-Adv" \
            --toolkit-dir "$GITHUB_WORKSPACE/HoshimiToolkit" \
            --translator-dir "$GITHUB_WORKSPACE/Hoshimi_Teleprompter" \
            "${flags[@]}"
      - name: Trigger patcher for the published plugin
        if: ${{ always() && steps.publish.outputs.plugin_tag != '' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          PATCHER_DISPATCH_TOKEN: ${{ secrets.PATCHER_DISPATCH_TOKEN }}
          PLUGIN_TAG: ${{ steps.publish.outputs.plugin_tag }}
          PATCHER_REPOSITORY: ${{ vars.PATCHER_REPOSITORY || 'DreamGallery/Idoly-Patcher' }}
        run: |
          python3 Idoly-localify/tools/release_followup.py dispatch \
            --repository "$GITHUB_REPOSITORY" --target "$PATCHER_REPOSITORY" --tag "$PLUGIN_TAG"
      - name: Remove superseded text releases and their tags
        if: ${{ always() && steps.publish.outputs.text_tag != '' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TEXT_TAG: ${{ steps.publish.outputs.text_tag }}
          KEEP_TEXT_RELEASES: ${{ inputs.text_releases_to_keep || vars.TEXT_RELEASES_TO_KEEP || '3' }}
        run: |
          python3 Idoly-localify/tools/release_followup.py cleanup \
            --repository "$GITHUB_REPOSITORY" --current-tag "$TEXT_TAG" \
            --keep "$KEEP_TEXT_RELEASES" --config "$IDOLY_RUNNER_CONFIG" --apply
      - name: Show safe release failure diagnostics
        if: failure()
        run: python3 translations-data/scripts/release_diagnostics.py --config "$IDOLY_RUNNER_CONFIG"
