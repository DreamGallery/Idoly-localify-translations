name: Sync published machine translations
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 仅检查待补齐的机器译文，不提交
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: idoly-localization-release
  cancel-in-progress: false
jobs:
  synchronize:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Load installed runner tools
        env:
          IDOLY_RUNNER_CONFIG: ${{ vars.IDOLY_RUNNER_CONFIG }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path(os.environ['IDOLY_RUNNER_CONFIG']).read_text())
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(config['bin_dir'] + '\n')
          PY
      - name: Fill matching empty AI translations
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flags=()
          [[ "$DRY_RUN" != true ]] && flags+=(--apply)
          python3 trusted/scripts/sync_machine_translations.py --repository-dir trusted "${flags[@]}"
