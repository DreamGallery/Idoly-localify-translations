name: Sync original stories and create tasks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: idoly-localization-release
  cancel-in-progress: false
jobs:
  synchronize:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    env:
      IDOLY_RUNNER_CONFIG: ${{ vars.IDOLY_RUNNER_CONFIG }}
    steps:
      - name: Load installed runner tools
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path(os.environ['IDOLY_RUNNER_CONFIG']).read_text())
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(config['bin_dir'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: main
          path: translations
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: DreamGallery/Hoshimi-Adv
          ref: main
          path: source
          persist-credentials: false
      - name: Validate, migrate, commit data and reconcile task Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 translations/scripts/sync_story_sources.py --source-repo source --data-dir translations --apply
