name: Runner environment check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect available build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "Architecture: $(uname -m)"
          echo "User ID: $(id -u)"
          if [ -f /etc/os-release ]; then
            sed -n '/^PRETTY_NAME=/p' /etc/os-release
          fi
          for tool in python3 git gh java docker curl unzip sudo apt-get; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: available"
            else
              echo "$tool: missing"
            fi
          done
          if command -v python3 >/dev/null 2>&1; then python3 --version; fi
          if command -v java >/dev/null 2>&1; then java -version 2>&1 | head -3; fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            echo "Unattended dependency installation: available"
          else
            echo "Unattended dependency installation: unavailable"
          fi
          df -Pk "$RUNNER_TEMP" | tail -1 | awk '{print "Free disk KiB: "$4}'
          test ! -f /.dockerenv || echo "Container runner: yes"
          echo "Runner check completed. No credentials were read or changed."
